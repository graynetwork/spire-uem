name: "spire-agent"
arch: "amd64"
platform: "linux"
version: "0.1.0"
section: "admin"
priority: "optional"
maintainer: "SpireUEM Engineering <engineering@spire-uem.org>"
description: |
  SpireUEM Unified Endpoint Management Agent Daemon (spired) for Debian desktop fleets.
vendor: "SpireUEM"
homepage: "https://github.com/spire-uem/spire-uem"
license: "Apache-2.0"

depends:
  - python3
  - python3-gi
  - gir1.2-gtk-4.0
  - gir1.2-adw-1

# libnss3-tools provides certutil and pk12util, which spire-hub uses to put the per-user
# browser certificate in the user's NSS database. Without it browser certificates are not
# installed and spire-hub says so.
recommends:
  - libnss3-tools

contents:
  - src: ./bin/spired
    dst: /usr/local/bin/spired
    file_info:
      mode: 0755
      owner: root
      group: root

  - src: ./bin/spire-ctl
    dst: /usr/bin/spire-ctl
    file_info:
      mode: 0755
      owner: root
      group: root

  - src: ./bin/spire-hub
    dst: /usr/bin/spire-hub
    file_info:
      mode: 0755
      owner: root
      group: root

  - src: ./cmd/spire-hub/spire-hub.py
    dst: /usr/lib/spire/spire-hub.py
    file_info:
      mode: 0755
      owner: root
      group: root

  - src: ./packaging/desktop/spire-hub.desktop
    dst: /usr/share/applications/spire-hub.desktop
    file_info:
      mode: 0644
      owner: root
      group: root

  # Starts spire-hub's browser certificate loop (no window) at login.
  - src: ./packaging/desktop/spire-hub-browser-cert.desktop
    dst: /etc/xdg/autostart/spire-hub-browser-cert.desktop
    file_info:
      mode: 0644
      owner: root
      group: root

  - src: ./packaging/icons/spire-hub.svg
    dst: /usr/share/icons/hicolor/scalable/apps/spire-hub.svg
    file_info:
      mode: 0644
      owner: root
      group: root

  - src: ./packaging/spired.service
    dst: /lib/systemd/system/spired.service
    file_info:
      mode: 0644
      owner: root
      group: root

  - src: ./packaging/spire-agent-rollback.service
    dst: /lib/systemd/system/spire-agent-rollback.service
    file_info:
      mode: 0644
      owner: root
      group: root

  - src: ./packaging/spire-agent-rollback.timer
    dst: /lib/systemd/system/spire-agent-rollback.timer
    file_info:
      mode: 0644
      owner: root
      group: root

  # Pinned release-signing trust anchors for independent update-manifest verification.
  # Shipped INSIDE the package so the control plane can never supply them.
  - src: ./packaging/release-keys/*.pub
    dst: /usr/share/spire/release-keys/
    file_info:
      mode: 0644
      owner: root
      group: root

  - src: ./packaging/config.example.yaml
    dst: /etc/spire/config.yaml.example
    type: config
    file_info:
      mode: 0644
      owner: root
      group: root

scripts:
  postinstall: ./packaging/scripts/postinstall.sh
  preremove: ./packaging/scripts/preremove.sh
