# SpireUEM Configuration Example
server:
  listen_addr: ":8080"
  database_url: "postgres://spire:spirepassword@localhost:5432/spire_uem?sslmode=disable"
  # Device mutual TLS: off | optional (default) | required. In required mode, device
  # REST/WebSocket endpoints refuse any request without a valid client certificate matching
  # the device's bearer token. required cannot be combined with a trusted TLS proxy.
  device_mtls: "optional"
  # Internal ECDSA P-256 device CA (generated on first start if absent; key written mode 0600).
  device_ca_cert_file: "internal/crypto/device-ca.crt"
  device_ca_key_file: "internal/crypto/device-ca.key"
  # Lifetime of an issued device leaf certificate (Go duration). Default 720h (30 days).
  device_cert_validity: "720h"

agent:
  server_url: "http://localhost:8080"
  token_path: "/etc/spire/token"
  checkin_interval: "5m"
  poll_interval: "10s"
  # Independent signed agent updates. require_signed_updates DEFAULTS TO TRUE: the agent
  # refuses any update whose Ed25519 manifest does not verify under a pinned release key.
  # Set it to false ONLY during the unsigned-to-signed transition (unsigned updates then
  # install with a loud warning). release_keys_dir holds the pinned trust anchors shipped
  # in the package; leave it at the default unless you relocate them.
  require_signed_updates: true
  release_keys_dir: "/usr/share/spire/release-keys"
  # Pin the control-plane's TLS trust, replacing the system root store for the server
  # connection (removes first-contact trust in the wipe-signing key). Optional.
  # server_ca_file: "/etc/spire/server-ca.pem"
  # server_ca_sha256: "<hex sha256 of the server leaf certificate>"
  # Automated enrollment token. enrollment_token_file (preferred) points at a 0600 file the
  # agent reads ONCE and DELETES on a successful enrollment; the secret never lives in this
  # config. enrollment_token is the lowest-precedence fallback (file > env SPIRE_ENROLLMENT_TOKEN
  # > this value); avoid it in favour of the file so the secret is not stored in config.yaml.
  # enrollment_token_file: "/etc/spire/enrollment-token"
  # enrollment_token: ""
