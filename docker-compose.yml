services:
  postgres:
    image: postgres:16-alpine
    container_name: spire-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: spire
      POSTGRES_PASSWORD: spirepassword
      POSTGRES_DB: spire_uem
    ports:
      - "127.0.0.1:5432:5432"   # loopback only; never publish Postgres on all interfaces
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spire -d spire_uem"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
