{{define "mfa_challenge.html"}}
<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Two-Factor Authentication - SpireUEM</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <script src="/static/vendor/tailwindcss-play.js"></script>
    <style> body { background-color: #0a0e17; color: #f1f5f9; } </style>
</head>
<body class="text-slate-100 min-h-screen flex items-center justify-center font-sans antialiased p-4 selection:bg-blue-600/30">
    <div class="max-w-sm w-full bg-[#0f1420] border border-[#1a2234] rounded-lg p-7 shadow-xl">
        <div class="flex items-center space-x-2.5 mb-6 justify-center">
            <div class="h-8 w-8 rounded-md bg-blue-600 flex items-center justify-center font-bold text-white text-sm">
                <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
            </div>
            <span class="text-lg font-semibold tracking-tight text-white">Spire<span class="text-blue-400">UEM</span></span>
        </div>

        <h1 class="text-center text-sm font-medium text-slate-200 mb-1">Two-Factor Authentication</h1>
        <p class="text-center text-xs text-slate-500 mb-5">Enter the 6-digit code from your authenticator app, or a recovery code.</p>

        {{if .Error}}
        <div role="alert" class="mb-4 py-2 px-3 border-l-2 border-rose-500 bg-rose-500/10 text-rose-400 text-xs text-center font-mono">{{.Error}}</div>
        {{end}}

        <form method="POST" action="/login/mfa">
            <input name="code" inputmode="numeric" autocomplete="one-time-code" autofocus
                   class="w-full px-3 py-2 text-center text-lg tracking-widest rounded-md bg-[#0a0e17] border border-[#1a2234] text-white font-mono mb-4"
                   placeholder="000000"/>
            <button type="submit" class="w-full py-2 px-3 bg-blue-600 hover:bg-blue-500 text-white font-medium text-xs rounded-md transition">Verify</button>
        </form>
        <p class="text-center mt-4"><a href="/login" class="text-xs text-slate-500 hover:text-slate-300">Cancel and sign in again</a></p>
    </div>
</body>
</html>
{{end}}
