services:
  postgres:
    image: postgres:16-alpine
    container_name: spire-test-postgres
    environment:
      POSTGRES_USER: spire
      POSTGRES_PASSWORD: spirepassword
      POSTGRES_DB: spire_uem
    ports:
      - "127.0.0.1:5433:5432"
    # The migrations directory is intentionally NOT mounted into /docker-entrypoint-initdb.d;
    # the spire-server container applies migrations via the tracked runner.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spire -d spire_uem"]
      interval: 2s
      timeout: 3s
      retries: 15
    networks:
      - spire-test-net

  spire-server:
    build:
      context: .
      dockerfile: test/Dockerfile.server
    image: spire-test-server:latest
    container_name: spire-test-server
    restart: on-failure
    working_dir: /app
    environment:
      DATABASE_URL: "postgres://spire:spirepassword@postgres:5432/spire_uem?sslmode=disable"
      SPIRE_LISTEN_ADDR: ":8080"
      SPIRE_MIGRATIONS_PATH: "/app/migrations/000001_init_schema.up.sql"
      SPIRE_SIMULATE_TPM2: "1"
      SPIRE_SESSION_SECRET: "spire-e2e-session-secret-key-32b-fixed"
      SPIRE_ADMIN_PASSWORD: "${SPIRE_ADMIN_PASSWORD:-spire-e2e-breakglass-pw}"
      # Test harness only: enables the unauthenticated mock-claims /auth/oidc/test-callback
      SPIRE_ENABLE_TEST_ENDPOINTS: "1"
      # Test network only: the server refuses plain HTTP on a reachable address without this.
      SPIRE_ALLOW_INSECURE_HTTP: "1"
      SPIRE_APT_REPO_DIR: "/var/www/apt/spire"
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - ./bin/spire-server:/app/spire-server:ro
      - ./migrations:/app/migrations:ro
      - ./packaging:/app/packaging:ro
      - ./dist:/app/dist:ro
      - ./internal/crypto:/app/internal/crypto
      - apt-repo-data:/var/www/apt/spire
    command: ["/app/spire-server"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - spire-test-net

  debian-client:
    privileged: true
    build:
      context: .
      dockerfile: test/Dockerfile.debian-client
    container_name: spire-test-debian-client
    hostname: debian12-sim-01
    environment:
      SPIRE_SERVER_URL: "http://spire-server:8080"
      SPIRE_AGENT_ALLOW_INSECURE_HTTP: "1"
      SPIRE_TOKEN_PATH: "/etc/spire/token"
      SPIRE_POLL_INTERVAL: "2s"
      SPIRE_CHECKIN_INTERVAL: "3s"
      SPIRE_SIMULATE_TPM2: "1"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    depends_on:
      - spire-server
    networks:
      - spire-test-net

networks:
  spire-test-net:
    driver: bridge

volumes:
  apt-repo-data:
