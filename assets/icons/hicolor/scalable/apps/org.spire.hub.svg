<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <!-- Background: Solid Slate / Dark Charcoal Canvas -->
  <rect width="512" height="512" rx="104" ry="104" fill="#161a22"/>

  <!-- Negative Space Cutout Mask for Spire Isolation -->
  <defs>
    <mask id="spire-negative-space">
      <rect width="512" height="512" fill="#FFFFFF"/>
      <!-- Upper Spire cutout footprint (+12px dilation) -->
      <path d="M 256 26 L 164 232 L 256 274 L 348 232 Z" fill="#000000"/>
      <!-- Lower Stem cutout footprint (+12px dilation) -->
      <path d="M 256 264 L 194 286 L 224 456 L 256 488 L 288 456 L 318 286 Z" fill="#000000"/>
    </mask>
  </defs>

  <!-- Orbital Swirl: Continuous Compliance & Debian Fibonacci Crescent -->
  <g id="swirl" mask="url(#spire-negative-space)">
    <!-- Sweeping outer perimeter arc -->
    <path d="M 206 462
             C 114 452 48 368 48 256
             C 48 142 140 48 256 48
             C 372 48 464 140 464 256
             C 464 348 402 426 316 450
             C 288 458 260 458 236 450
             C 226 446 224 436 228 428
             C 232 420 242 418 252 420
             C 320 404 374 350 392 284
             C 404 238 398 188 372 148
             C 334 94 272 74 206 84
             C 130 96 74 162 74 246
             C 74 332 126 410 208 434
             C 216 436 220 446 216 454
             C 214 458 210 462 206 462 Z"
          fill="#FFFFFF"/>

    <!-- Inward Fibonacci spiral curl looping into right facet -->
    <path d="M 392 284
             C 380 338 340 382 286 394
             C 236 406 182 384 158 338
             C 138 300 142 254 168 222
             C 192 194 228 182 262 186
             C 288 190 310 204 322 228
             C 332 250 326 274 310 290
             C 294 304 270 308 252 300
             C 240 294 234 280 240 268
             C 244 258 258 252 268 256
             C 274 258 278 264 280 270
             C 282 272 284 272 284 270
             C 286 262 286 252 278 242
             C 268 226 248 218 230 220
             C 206 224 186 244 180 268
             C 174 296 184 324 206 342
             C 232 364 274 372 308 356
             C 342 340 368 306 376 270
             C 378 262 388 258 396 262
             C 402 266 404 274 402 280
             C 400 282 396 284 392 284 Z"
          fill="#FFFFFF"/>
  </g>

  <!-- Central Spire: Vertical Faceted Arrowhead & Security Telemetry Pillar -->
  <g id="spire">
    <!-- Upper Arrowhead - Left Light Facet (Pure Vector White) -->
    <path d="M 256 40
             L 178 224
             L 256 262
             Z"
          fill="#FFFFFF"/>

    <!-- Upper Arrowhead - Right Shadow Facet (Obsidian Black with White Geometric Accent) -->
    <path d="M 256 40
             L 256 262
             L 334 224
             Z"
          fill="#000000"
          stroke="#FFFFFF"
          stroke-width="1.75"
          stroke-linejoin="round"/>

    <!-- Upper Spire Center Ridge Highlight Line -->
    <line x1="256" y1="40" x2="256" y2="262" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Lower Stem - Left Light Facet (Pure Vector White) -->
    <path d="M 256 278
             L 204 300
             L 234 448
             L 256 474
             Z"
          fill="#FFFFFF"/>

    <!-- Lower Stem - Right Shadow Facet (Solid Obsidian Black with Angled 3D Cut) -->
    <path d="M 256 278
             L 256 474
             L 278 448
             L 308 300
             Z"
          fill="#000000"
          stroke="#FFFFFF"
          stroke-width="1.75"
          stroke-linejoin="round"/>

    <!-- Lower Spire Center Ridge -->
    <line x1="256" y1="278" x2="256" y2="474" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>

    <!-- Precision Core Diamond Accent at Node Intersection -->
    <polygon points="256,258 268,270 256,282 244,270" fill="#161a22" stroke="#FFFFFF" stroke-width="2.5"/>
  </g>
</svg>